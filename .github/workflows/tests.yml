name: Replay tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,mcp]"
      - run: python -m pytest -q
      - run: |
          evalgate init workspace
          cd workspace
          evalgate run suites/water-utility-intake.yaml --trace traces/baseline.json --out runs/baseline.json
          evalgate gate --run runs/baseline.json
